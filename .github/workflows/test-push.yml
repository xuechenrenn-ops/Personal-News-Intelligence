name: Test Push Channel

on:
  workflow_dispatch: {}

jobs:
  push-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message via PushPlus
        run: |
          curl -s -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"${{ secrets.PUSHPLUS_TOKEN }}\",
              \"title\": \"云端推送通道测试\",
              \"content\": \"如果你收到这条消息，说明 GitHub Actions → PushPlus → 你的微信 这条通道已经完全打通。电脑不需要开机。\",
              \"template\": \"txt\"
            }"
