name: Guarded news experiment
on:
  push:
    branches: [upgrade/news-pipeline-v1]
    paths: ['experiments/dispatch/*.json']
permissions:
  contents: write
concurrency:
  group: news-pipeline-experiment
  cancel-in-progress: false
jobs:
  replay:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/upgrade/news-pipeline-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pipeline dependencies
        run: pip install -r requirements.txt
      - name: Run fixed dataset with a durable reservation
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m experiments.run "$RUNNER_TEMP/experiment.json"
      - name: Render two preview messages
        run: >-
          python -m experiments.preview "$RUNNER_TEMP/experiment.json"
          experiments/fixtures/2026-11-26.json "$RUNNER_TEMP/news-preview"
      - uses: actions/upload-artifact@v4
        with:
          name: normalized-experiment
          path: |
            ${{ runner.temp }}/experiment.json
            ${{ runner.temp }}/news-preview/*.md
          retention-days: 3
