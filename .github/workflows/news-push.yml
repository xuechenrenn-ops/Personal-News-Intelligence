name: Daily News Push

on:
  push:
    branches: [main]
    paths: ['.github/pni-acceptance.json']
  workflow_dispatch:
    inputs:
      morning_catch_up_date:
        description: 'Beijing date (YYYY-MM-DD) for an approved morning catch-up. Leave blank for archived preview.'
        type: string
        required: false
      beijing_date:
        description: 'Cloudflare edition date (YYYY-MM-DD, Beijing).'
        type: string
      edition:
        description: 'Cloudflare edition name (morning or evening).'
        type: string
      scheduled_beijing:
        description: 'Cloudflare planned time (ISO 8601 with +08:00).'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: pni-production
  cancel-in-progress: false

jobs:
  news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run V1.7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_ACCESS_KEY: ${{ secrets.PUSHPLUS_ACCESS_KEY }}
          PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
          TAVILY_KEY: ${{ vars.PNI_ENABLE_TAVILY == 'true' && secrets.TAVILY_KEY || '' }}
          PNI_TRIAL_START: ${{ vars.PNI_TRIAL_START }}
          PNI_MORNING_CATCH_UP_DATE: ${{ inputs.morning_catch_up_date }}
          PNI_SCHEDULE_SOURCE: ${{ vars.PNI_SCHEDULE_SOURCE }}
          PNI_DISPATCH_DATE: ${{ inputs.beijing_date }}
          PNI_DISPATCH_EDITION: ${{ inputs.edition }}
          PNI_DISPATCH_SCHEDULED_BEIJING: ${{ inputs.scheduled_beijing }}
          GH_TOKEN: ${{ github.token }}
        run: python -m pni.production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pni-daily-briefs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/pni/news-preview/*.md
            ${{ runner.temp }}/pni/news-preview/*.html
            ${{ runner.temp }}/pni/run-summary.json
