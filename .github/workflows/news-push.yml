name: Daily News Push

on:
  workflow_dispatch:
    inputs:
      push_enabled:
        description: "是否发送真实微信推送（首次测试请保持 false）"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Restore cross-run news state
        uses: actions/cache@v4
        with:
          path: .cache/news_state.json
          key: news-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            news-state-${{ github.ref_name }}-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate code and configuration
        run: |
          python -m py_compile news_push.py meeting_tracker.py
          python -m json.tool sources.json > /dev/null
          python -m json.tool meeting_calendar.json > /dev/null
      - name: Run news pipeline
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BAICHUAN_API_KEY: ${{ secrets.BAICHUAN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSH_ENABLED: ${{ inputs.push_enabled }}
        run: python news_push.py
