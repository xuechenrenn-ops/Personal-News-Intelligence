name: Daily News Push

on:
  push:
    branches: [main]
    paths: ['.github/pni-acceptance.json']
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: pni-production
  cancel-in-progress: false

jobs:
  news:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate V1.7 production configuration
        run: python -m unittest discover -s tests -q
      - name: Run V1.7
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_ACCESS_KEY: ${{ secrets.PUSHPLUS_ACCESS_KEY }}
          PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
          PNI_TRIAL_START: '2026-11-27'
          GH_TOKEN: ${{ github.token }}
        run: python -m pni.production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pni-daily-briefs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/pni/news-preview/*.md
            ${{ runner.temp }}/pni/news-preview/*.html
            ${{ runner.temp }}/pni/run-summary.json
