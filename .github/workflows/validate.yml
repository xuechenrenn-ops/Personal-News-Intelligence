name: PNI Cloudflare Schedule Probe
run-name: PNI probe · ${{ inputs.beijing_date }} ${{ inputs.edition }}

on:
  workflow_dispatch:
    inputs:
      beijing_date:
        required: true
        type: string
      edition:
        required: true
        type: string
      scheduled_beijing:
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/ops/pni-cloudflare-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Measure entry time and validate dated slot
        env:
          PROBE_DATE: ${{ inputs.beijing_date }}
          PROBE_EDITION: ${{ inputs.edition }}
          PROBE_SLOT: ${{ inputs.scheduled_beijing }}
        run: |
          python3 -B - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pni.schedule_inputs import parse_dispatch_slot

          now = datetime.now(timezone.utc)
          nominal = parse_dispatch_slot(os.environ["PROBE_DATE"], os.environ["PROBE_EDITION"], os.environ["PROBE_SLOT"])
          delay = (now - nominal).total_seconds()
          print(json.dumps({
              "event": "schedule_probe",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "edition": os.environ["PROBE_EDITION"],
              "planned_beijing": nominal.isoformat(),
              "entered_beijing": now.astimezone(nominal.tzinfo).isoformat(),
              "lag_seconds": round(delay, 3),
          }), flush=True)
          if not 0 <= delay <= 600:
              raise SystemExit("Probe did not enter within ten minutes of the scheduled slot")
          PY
