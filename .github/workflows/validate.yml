name: Validate News Pipeline

on:
  push:
    branches:
      - upgrade/news-pipeline-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile news_push.py cache_manager.py tavily_search.py source_check.py
      - name: Validate JSON configuration
        run: |
          python -m json.tool sources.json > /dev/null
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
