name: V1.7 Selection Acceptance

on:
  push:
    branches: [upgrade/news-pni-v1.7]
    paths: ['.github/pni-v17-generate.json', '.github/pni-v17-send.json']

permissions:
  contents: write
  actions: read

concurrency:
  group: pni-v17-selection-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/upgrade/news-pni-v1.7' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Resolve the reviewed source run
        id: reviewed
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          marker = Path('.github/pni-v17-send.json')
          if marker.is_file():
              run = json.loads(marker.read_text())['run_id']
              assert type(run) is int and run > 0
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  print(f'run_id={run}', file=out)
          PY
      - name: Generate once with read-only production history
        if: steps.reviewed.outputs.run_id == ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m pni.acceptance_v17 generate "$RUNNER_TEMP/pni-acceptance"
      - uses: actions/download-artifact@v4
        if: steps.reviewed.outputs.run_id != ''
        with:
          name: pni-v17-acceptance
          path: ${{ runner.temp }}/pni-reviewed
          run-id: ${{ steps.reviewed.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Deliver the audited HTML once
        if: steps.reviewed.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_ACCESS_KEY: ${{ secrets.PUSHPLUS_ACCESS_KEY }}
          PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
        run: python -m pni.acceptance_v17 send "$RUNNER_TEMP/pni-acceptance" --artifact "$RUNNER_TEMP/pni-reviewed" --approval .github/pni-v17-send.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pni-v17-acceptance
          path: ${{ runner.temp }}/pni-acceptance
          retention-days: 7
          if-no-files-found: ignore
